[tools]
bun = "1.4.2"

[tasks.install]
description = "Install the locked workspace dependencies"
run = "bun install --frozen-lockfile"

[tasks.typecheck]
description = "Check all workspace TypeScript types"
run = ["bun run --workspaces typecheck", "bunx --no-install tsc --project tests/tsconfig.json"]

[tasks.lint]
description = "Lint source files without changing them"
run = "bunx --no-install biome lint ."

[tasks.format]
description = "Format source files and project configuration"
run = "bunx --no-install biome format --write ."

[tasks."format:check"]
description = "Check formatting without changing files"
run = "bunx --no-install biome format ."

[tasks.check]
description = "Check formatting, types, and protocol contracts"
depends = ["lint", "format:check", "typecheck", "test"]

[tasks.test]
description = "Run contract tests"
run = "bun test ./tests"

[tasks."protocol:generate"]
description = "Export the protocol and policy schemas for native hosts"
run = ["bun packages/protocol/scripts/generate.ts", "bunx --no-install biome format --write native/host-api/generated"]
