[tools]
bun = "1.4.2"
lefthook = "2.2.1"
"github:google/google-java-format" = "1.36.1"

[tasks.install]
description = "Install the locked workspace dependencies"
run = "bun install --frozen-lockfile"

[tasks."hooks:install"]
description = "Install the repository Git hooks"
run = "lefthook install"

[tasks."check:staged"]
description = "Check formatting and lint for staged files without changing them"
run = "bunx --no-install biome check --staged --assist-enabled=false --no-errors-on-unmatched"

[tasks.typecheck]
depends = ["plugins:build"]
description = "Check all workspace TypeScript types"
run = ["bun run --workspaces typecheck", "bunx --no-install tsc --project tests/tsconfig.json", "bunx --no-install tsc --project tests/fixtures/android/web/tsconfig.json"]

[tasks.lint]
description = "Lint source files without changing them"
run = "bunx --no-install biome lint ."

[tasks.format]
description = "Format source files and project configuration"
depends = ["format:java"]
run = "bunx --no-install biome format --write ."

[tasks."format:check"]
description = "Check formatting without changing files"
run = "bunx --no-install biome format ."

[tasks."format:java"]
description = "Format Java sources with google-java-format (AOSP style)"
shell = "bun exec"
run = "google-java-format --aosp --replace $(git ls-files --cached --others --exclude-standard '*.java')"

[tasks."format:java:check"]
description = "Check Java formatting without changing files"
shell = "bun exec"
run = "google-java-format --aosp --dry-run --set-exit-if-changed $(git ls-files --cached --others --exclude-standard '*.java')"

[tasks.check]
description = "Check formatting, types, and protocol contracts"
depends = ["lint", "format:check", "format:java:check", "typecheck", "test"]

[tasks.test]
depends = ["plugins:build"]
description = "Run contract tests"
run = "bun test ./tests"

[tasks."protocol:generate"]
description = "Export the protocol and policy schemas for native hosts"
run = ["bun packages/protocol/scripts/generate.ts", "bunx --no-install biome format --write native/host-api/generated"]

[tasks."host:windows"]
depends = ["plugins:build"]
description = "Build the Windows product host package and verify the WebView boundary, policy, application-selected storage paths and cleanup"
run = "bun --no-env-file tests/lifecycle/run-native.ts --target windows-x64"

[tasks."host:macos"]
depends = ["plugins:build"]
description = "Build the macOS Bun FFI app without a C compiler and verify WKWebView, policy and Worker cleanup"
run = "bun --no-env-file tests/lifecycle/run-native.ts --target macos-arm64"

[tasks."host:android"]
depends = ["plugins:build"]
description = "Build the Android APK and verify the actual Core, SDK, WebView and lifecycle on a selected device"
run = "bun native/android/run.ts"

[tasks."plugins:build"]
description = "Build neutral plugin declarations and per-platform native exports"
run = "bun run plugins:build"
