<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
<title>bunaway 메모 — 읽기 전용</title>
<link rel="stylesheet" href="/memo.css">
</head>
<body class="reader">
<div class="shell">
<header class="app-header">
<div class="brand">
<span class="brand-icon" aria-hidden="true">
<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
<rect x="5" y="3" width="14" height="18" rx="2"/>
<path d="M9 8h6M9 12h6M9 16h3"/>
</svg>
</span>
<span class="brand-name">메모<span class="brand-byline">by bunaway</span>
</span>
</div>
<span class="local-badge">읽기 전용</span>
</header>
<main>
<div class="intro">
<p class="eyebrow">A MOMENT TO READ</p>
<h1>남겨둔 생각을 다시 읽어요.</h1>
<p class="description">편집 창에서 저장한 메모가 여기에 함께 표시돼요.</p>
</div>
<section class="card snapshot" aria-label="저장된 메모">
<div class="paper">
<p class="paper-label">KEEP THIS THOUGHT</p>
<pre id="saved-memo">
</pre>
</div>
</section>
<div class="status-bar">
<p id="status" class="status" role="status">연결 중…</p>
</div>
<details class="permission-check">
<summary>읽기 전용 권한 확인</summary>
<p>이 창에서는 메모를 읽을 수 있지만 저장할 수 없어요.</p>
<button type="button" class="secondary-button" id="try-save" disabled>저장 제한 확인</button>
</details>
</main>
<footer class="app-footer">MADE WITH BUNAWAY</footer>
</div>
<script src="/reader.js">
</script>
</body>
</html>
