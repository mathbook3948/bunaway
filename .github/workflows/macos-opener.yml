name: macOS opener native fixture

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-opener-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-opener:
    name: macOS opener NSWorkspace (arm64)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - run: mise run install
      - run: mise run plugins:build
      - name: Exercise real NSWorkspace in a disposable runner session
        shell: bash
        env:
          BUNAWAY_OPENER_ISOLATED: '1'
        run: |
          set -o pipefail
          mkdir -p build/macos-opener-logs
          test "$(uname -m)" = arm64
          mise exec -- bun --no-env-file test tests/lifecycle/macos-opener.test.ts tests/lifecycle/macos-opener-native.test.ts 2>&1 | tee build/macos-opener-logs/native.log
          test -f build/macos-opener-results.json
          mise exec -- bun --no-env-file tests/lifecycle/macos-opener-host.ts 2>&1 | tee build/macos-opener-logs/host.log
          test -f build/macos-opener-host-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: macos-opener-native-diagnostics
          path: |
            build/macos-opener-results.json
            build/macos-opener-host-results.json
            build/macos-opener-host-diagnostics/
            build/macos-opener-logs/
          if-no-files-found: warn
          retention-days: 7
