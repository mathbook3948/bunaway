name: macOS storage native

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  storage-native:
    name: macOS storage native (arm64, ad-hoc signed)
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up mise and pinned Bun
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Install locked dependencies and build plugin contracts
        run: |
          mise run install
          mise run plugins:build
      - name: Compile and ad-hoc sign the isolated storage fixture
        run: |
          test "$(uname -m)" = arm64
          mkdir -p build/macos-storage-native
          mise exec -- bun build --compile tests/lifecycle/macos-storage.ts --outfile build/macos-storage-native/fixture
          codesign --force --sign - --entitlements native/macos/bun/entitlements.plist build/macos-storage-native/fixture
          codesign --verify --strict build/macos-storage-native/fixture
      - name: Execute real storage operations in the signed fixture
        run: |
          set -o pipefail
          build/macos-storage-native/fixture 2>&1 | tee build/macos-storage-native/native.log
      - name: Execute packaged WKWebView storage calls through the host I/O Worker
        run: mise exec -- bun --no-env-file tests/lifecycle/macos-storage-host.ts 2>&1 | tee build/macos-storage-native/host.log
      - name: Upload storage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-storage-native-evidence
          path: |
            build/macos-storage-results.json
            build/macos-storage-native/native.log
            build/macos-storage-native/host.log
            build/macos-storage-host-results.json
            build/macos-storage-host-diagnostics/
          if-no-files-found: warn
          retention-days: 7
