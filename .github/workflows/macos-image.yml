name: macOS image codecs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-image:
    name: macOS native image codecs (arm64)
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up mise and pinned Bun
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Install and build native packages
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mise run install
          mise run plugins:build
      - name: Execute real codecs and an isolated installed consumer
        run: |
          set -euo pipefail
          mkdir -p build/macos-image-logs
          mise exec -- bun --no-env-file test tests/lifecycle/macos-image.test.ts tests/cli/image.test.ts 2>&1 | tee build/macos-image-logs/native.log
      - name: Compile, ad-hoc sign and execute the packaged codec fixture
        run: |
          set -euo pipefail
          mise exec -- bun build --compile tests/fixtures/macos-image-native.ts --outfile build/macos-image-native
          codesign --force --sign - --entitlements native/macos/bun/entitlements.plist build/macos-image-native
          codesign --verify --strict build/macos-image-native
          build/macos-image-native build/macos-image-results.json 2>&1 | tee build/macos-image-logs/compiled.log
      - name: Upload codec evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-image-evidence
          path: |
            build/macos-image-logs/
            build/macos-image-results.json
          if-no-files-found: warn
          retention-days: 7
