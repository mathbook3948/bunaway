name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up mise and pinned Bun
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Set up Node for the documentation toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Install locked dependencies
        run: mise run install
      - name: Install Inno Setup for installer regression tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw 'Inno Setup installer checksum mismatch.'
          }
          $installation = Start-Process -FilePath $installer -ArgumentList '/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS' -Wait -PassThru -WindowStyle Hidden
          if ($installation.ExitCode -ne 0) { throw "Inno Setup installation failed: $($installation.ExitCode)" }
          if (-not (Test-Path -LiteralPath "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            throw 'Inno Setup compiler is required for Windows installer regression tests.'
          }
      - name: Check formatting, lint, types and contracts
        run: mise run check
      - name: Build the documentation site and search index
        if: runner.os == 'Linux'
        run: bun run docs:build
      - name: Verify generated native schemas
        if: runner.os == 'Linux'
        run: |
          mise run protocol:generate
          git diff --exit-code -- native/host-api/generated

  windows-native:
    name: Windows native integration
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up mise and pinned Bun
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Install locked dependencies
        run: mise run install
      - name: Verify ZIP extraction in Unicode cache paths
        run: mise exec -- bun --no-env-file test tests/cli/native-build.test.ts
      - name: Build and test Bun FFI WebView2 host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows-native-logs | Out-Null
          mise run host:windows 2>&1 | Tee-Object -FilePath build/windows-native-logs/host.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect host diagnostics
        if: always()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'bunaway/tests.bunaway.host/logs'
          if (Test-Path -LiteralPath $logs) {
            New-Item -ItemType Directory -Force -Path build/windows-host-logs | Out-Null
            Copy-Item -Path "$logs/*" -Destination build/windows-host-logs -Recurse -Force
          }
      - name: Upload native test reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-diagnostics
          path: |
            build/windows-*-results.json
            build/windows-host-logs/
            build/windows-native-logs/
          if-no-files-found: ignore
          retention-days: 7

  macos-native:
    name: macOS native integration (arm64)
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up mise and pinned Bun
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Verify runner matches the pinned native runtime
        run: |
          mkdir -p build/macos-native-logs
          {
            sw_vers
            uname -m
            echo "Runner architecture: $RUNNER_ARCH; image: $ImageOS $ImageVersion"
            xcodebuild -version
            clang++ --version
            launchctl managername
            test "$(uname -m)" = arm64
            test "$RUNNER_ARCH" = ARM64
            mise exec -- bun -e 'import assert from "node:assert/strict"; const pin = await Bun.file("runtime/build-manifests/darwin-aarch64.json").json(); assert.equal(pin.bun.target, "darwin-aarch64"); console.log(pin.bun);'
          } 2>&1 | tee build/macos-native-logs/runner.log
      - name: Install locked dependencies
        run: mise run install 2>&1 | tee build/macos-native-logs/install.log
      - name: Build and test real WKWebView host and signed in-place app
        run: mise exec -- bun --no-env-file tests/lifecycle/run-native.ts --app 2>&1 | tee build/macos-native-logs/host.log
      - name: Upload native test reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-native-diagnostics
          path: |
            build/macos-host-results.json
            build/macos-native-logs/
            build/macos-host-diagnostics/
            build/macos-host-in-place/macos-host-results.json
            build/macos-host-in-place/macos-host-diagnostics/
          if-no-files-found: warn
          retention-days: 7
