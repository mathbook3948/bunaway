name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up mise and pinned Bun
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Install locked dependencies
        run: mise run install
      - name: Check formatting, lint, types and contracts
        run: mise run check
      - name: Verify generated native schemas
        if: runner.os == 'Linux'
        run: |
          mise run protocol:generate
          git diff --exit-code -- native/host-api/generated

  windows-native:
    name: Windows native integration
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up mise and pinned Bun
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Install locked dependencies
        run: mise run install
      - name: Build and test bundled-process probe
        run: mise run probe:windows
      - name: Build and test WebView2 host
        run: mise run host:windows
      - name: Collect host diagnostics
        if: always()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'bunaway/tests.bunaway.host/logs'
          if (Test-Path -LiteralPath $logs) {
            New-Item -ItemType Directory -Force -Path build/windows-host-logs | Out-Null
            Copy-Item -Path "$logs/*" -Destination build/windows-host-logs -Recurse -Force
          }
      - name: Upload native test reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-diagnostics
          path: |
            build/windows-*-results.json
            build/windows-host-logs/
          if-no-files-found: ignore
          retention-days: 7
