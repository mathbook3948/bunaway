name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Real Inno recovery/ACL cases run only on Windows. Keep their assertions and
    # test deadlines intact while allowing the complete platform check to finish.
    timeout-minutes: ${{ matrix.os == 'windows-2022' && 20 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up JDK for Android host regression tests
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up mise and pinned Bun
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Set up Node for the documentation toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Install locked dependencies
        run: mise run install
      - name: Install Inno Setup for installer regression tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw 'Inno Setup installer checksum mismatch.'
          }
          $installation = Start-Process -FilePath $installer -ArgumentList '/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS' -Wait -PassThru -WindowStyle Hidden
          if ($installation.ExitCode -ne 0) { throw "Inno Setup installation failed: $($installation.ExitCode)" }
          if (-not (Test-Path -LiteralPath "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            throw 'Inno Setup compiler is required for Windows installer regression tests.'
          }
      - name: Check formatting, lint and types
        run: 'mise run lint ::: format:check ::: format:java:check ::: typecheck'
      # These two complete image suites run once in macos-native, including the
      # isolated consumer's portable packaging assertions and real macOS codecs.
      - name: Check contracts
        id: contracts
        env:
          BUNAWAY_DMG_DIAGNOSTICS: '1'
          BUNAWAY_SIZE_CONSTRAINTS_DIAGNOSTICS: '1'
        run: mise run test --path-ignore-patterns '**/macos-image.test.ts' --path-ignore-patterns '**/cli/image.test.ts'
      # Compare after the unchanged full suite, so the probe cannot initialize
      # native state before the shared-process regression runs.
      - name: Compare size constraints in one fresh native process
        if: always() && runner.os == 'Windows' && (steps.contracts.outcome == 'success' || steps.contracts.outcome == 'failure')
        env:
          BUNAWAY_SIZE_CONSTRAINTS_DIAGNOSTICS: '1'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows-matrix-logs | Out-Null
          mise exec -- bun --no-env-file test tests/lifecycle/windows-size-constraints.test.ts 2>&1 | Tee-Object -FilePath build/windows-matrix-logs/size-constraints-isolated.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Compare the shortcut-only and combined UI lifetimes immediately before
          # the unchanged raw show-state probe, in one owned process after the full suite.
          $env:BUNAWAY_UI_SERVICE_SIZE_PAIR = '1'
          mise exec -- bun --no-env-file test tests/fixtures/ui-services-size-constraints.test.ts 2>&1 | Tee-Object -FilePath build/windows-matrix-logs/ui-services-size-constraints.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Windows matrix comparison
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-matrix-diagnostics
          path: |
            build/windows-matrix-logs/
            build/windows-native-logs/notification/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve fixture DMG diagnostics
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-matrix-packaging-diagnostics
          path: build/macos-packaging-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Build the documentation site and search index
        if: runner.os == 'Linux'
        run: bun run docs:build
      - name: Verify generated native schemas
        if: runner.os == 'Linux'
        run: |
          mise run protocol:generate
          git diff --exit-code -- native/host-api/generated

  windows-native:
    name: Windows native integration
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up mise and pinned Bun
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Install locked dependencies
        run: mise run install
      - name: Verify ZIP extraction in Unicode cache paths
        run: mise exec -- bun --no-env-file test tests/cli/native-build.test.ts
      - name: Build and test Bun FFI WebView2 host
        # Nested Windows PowerShell probes can emit CLIXML on stderr. Preserve
        # native bytes before any PowerShell pipeline attempts to deserialize them.
        shell: cmd
        run: |
          if not exist build\windows-native-logs mkdir build\windows-native-logs
          mise run host:windows > build\windows-native-logs\host.log 2>&1
          set "BUNAWAY_NATIVE_EXIT_CODE=%ERRORLEVEL%"
          type build\windows-native-logs\host.log
          exit /b %BUNAWAY_NATIVE_EXIT_CODE%
      - name: Verify geometry in fresh native processes
        shell: pwsh
        run: |
          foreach ($attempt in 1..3) {
            mise exec -- bun --no-env-file test tests/lifecycle/windows-geometry.test.ts 2>&1 | Tee-Object -FilePath "build/windows-native-logs/geometry-$attempt.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Collect host diagnostics
        if: always()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'bunaway/tests.bunaway.host/logs'
          if (Test-Path -LiteralPath $logs) {
            New-Item -ItemType Directory -Force -Path build/windows-host-logs | Out-Null
            Copy-Item -Path "$logs/*" -Destination build/windows-host-logs -Recurse -Force
          }
      - name: Upload native test reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-diagnostics
          path: |
            build/windows-*-results.json
            build/windows-host-logs/
            build/windows-native-logs/
          if-no-files-found: ignore
          retention-days: 7

  macos-native:
    name: macOS native integration (arm64)
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up mise and pinned Bun
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Verify runner matches the pinned native runtime
        run: |
          mkdir -p build/macos-native-logs
          {
            sw_vers
            uname -m
            echo "Runner architecture: $RUNNER_ARCH; image: $ImageOS $ImageVersion"
            launchctl managername
            test "$(uname -m)" = arm64
            test "$RUNNER_ARCH" = ARM64
            mise exec -- bun -e 'import assert from "node:assert/strict"; const pin = await Bun.file("runtime/build-manifests/darwin-aarch64.json").json(); assert.equal(pin.bun.target, "darwin-aarch64"); console.log(pin.bun);'
          } 2>&1 | tee build/macos-native-logs/runner.log
      - name: Install locked dependencies
        run: mise run install 2>&1 | tee build/macos-native-logs/install.log
      - name: Build native plugin packages
        run: mise run plugins:build
      - name: Test disposable Keychain and ad-hoc compiled safe storage
        run: mise exec -- bun --no-env-file test tests/lifecycle/macos-keychain-native.test.ts 2>&1 | tee build/macos-native-logs/safe-storage.log
      - name: Test safe storage through real WKWebView and host I/O
        run: mise exec -- bun --no-env-file tests/lifecycle/macos-safe-storage-host.ts 2>&1 | tee build/macos-native-logs/safe-storage-host.log
      - name: Verify macOS log and capability adapters and compiled probe
        run: mise exec -- bun --no-env-file test tests/lifecycle/macos-log-capabilities.test.ts tests/lifecycle/macos-log-capabilities-compiled.test.ts 2>&1 | tee build/macos-native-logs/log-capabilities.log
      - name: Execute real image codecs and an isolated installed consumer
        run: |
          set -euo pipefail
          mkdir -p build/macos-image-logs
          mise exec -- bun --no-env-file test tests/lifecycle/macos-image.test.ts tests/cli/image.test.ts 2>&1 | tee build/macos-image-logs/native.log
      - name: Compile, ad-hoc sign and execute the packaged codec fixture
        run: |
          set -euo pipefail
          mise exec -- bun build --compile tests/fixtures/macos-image-native.ts --outfile build/macos-image-native
          codesign --force --sign - --entitlements native/macos/bun/entitlements.plist build/macos-image-native
          codesign --verify --strict build/macos-image-native
          build/macos-image-native build/macos-image-results.json 2>&1 | tee build/macos-image-logs/compiled.log
      - name: Compile and ad-hoc sign the isolated storage fixture
        run: |
          mkdir -p build/macos-storage-native
          mise exec -- bun build --compile tests/lifecycle/macos-storage.ts --outfile build/macos-storage-native/fixture
          codesign --force --sign - --entitlements native/macos/bun/entitlements.plist build/macos-storage-native/fixture
          codesign --verify --strict build/macos-storage-native/fixture
      - name: Execute real storage operations in the signed fixture
        run: |
          set -o pipefail
          build/macos-storage-native/fixture 2>&1 | tee build/macos-storage-native/native.log
      # run-native.ts owns the signed WKWebView image fixture as well as the
      # other host regressions. Do not invoke macos-image-host.ts a second time.
      - name: Build and test real WKWebView host and signed in-place app
        env:
          BUNAWAY_OPENER_ISOLATED: '1'
          BUNAWAY_DMG_DIAGNOSTICS: '1'
        run: mise exec -- bun --no-env-file tests/lifecycle/run-native.ts --app 2>&1 | tee build/macos-native-logs/host.log
      - name: Upload native test reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-native-diagnostics
          path: |
            build/macos-image-logs/
            build/macos-packaging-diagnostics/
            build/macos-image-results.json
            build/macos-image-host-results.json
            build/macos-webview-controls-results.json
            build/macos-webview-controls-diagnostics/
            build/macos-storage-results.json
            build/macos-storage-native/native.log
            build/macos-appearance-results.json
            build/macos-storage-host-results.json
            build/macos-storage-host-diagnostics/
            build/macos-io-diagnostics/
            build/macos-safe-storage-results.json
            build/macos-safe-storage-diagnostics/
            build/macos-io-results.json
            build/macos-opener-results.json
            build/macos-opener-host-results.json
            build/macos-opener-host-diagnostics/
            build/macos-log-capabilities-results.json
            build/macos-log-capabilities-diagnostics/
            build/macos-host-results.json
            build/macos-clipboard-results.json
            build/macos-native-logs/
            build/macos-host-diagnostics/
            build/macos-host-in-place/macos-host-results.json
            build/macos-host-in-place/macos-host-diagnostics/
          if-no-files-found: warn
          retention-days: 7
