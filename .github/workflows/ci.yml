name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up mise and pinned Bun
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Install locked dependencies
        run: mise run install
      - name: Check formatting, lint, types and contracts
        run: mise run check
      - name: Verify generated native schemas
        if: runner.os == 'Linux'
        run: |
          mise run protocol:generate
          git diff --exit-code -- native/host-api/generated

  windows-native:
    name: Windows native integration
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up mise and pinned Bun
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Install locked dependencies
        run: mise run install
      - name: Build and test Bun FFI WebView2 host
        run: mise run host:windows
      - name: Collect host diagnostics
        if: always()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'bunaway/tests.bunaway.host/logs'
          if (Test-Path -LiteralPath $logs) {
            New-Item -ItemType Directory -Force -Path build/windows-host-logs | Out-Null
            Copy-Item -Path "$logs/*" -Destination build/windows-host-logs -Recurse -Force
          }
      - name: Upload native test reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-diagnostics
          path: |
            build/windows-*-results.json
            build/windows-host-logs/
          if-no-files-found: ignore
          retention-days: 7

  macos-native:
    name: macOS native integration (arm64)
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify runner matches the pinned native runtime
        run: |
          mkdir -p build/macos-native-logs
          {
            sw_vers
            uname -m
            echo "Runner architecture: $RUNNER_ARCH; image: $ImageOS $ImageVersion"
            xcodebuild -version
            clang++ --version
            launchctl managername
            test "$(uname -m)" = arm64
            test "$RUNNER_ARCH" = ARM64
            /usr/bin/python3 -c 'import json; pin = json.load(open("runtime/build-manifests/darwin-aarch64.json")); assert pin["bun"]["target"] == "darwin-aarch64"; print(pin["bun"])'
          } 2>&1 | tee build/macos-native-logs/runner.log
      - name: Set up mise and pinned Bun
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Install locked dependencies
        run: mise run install 2>&1 | tee build/macos-native-logs/install.log
      # Both scripts populate runtime/bun-bundle/vendor: never run cold builds in parallel.
      - name: Build and test bundled-process probe
        run: mise run probe:macos 2>&1 | tee build/macos-native-logs/probe.log
      - name: Build and test real WKWebView host and signed in-place app
        run: mise exec -- zsh native/macos/host/run.sh --app 2>&1 | tee build/macos-native-logs/host.log
      - name: Upload native test reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-native-diagnostics
          path: |
            build/macos-probe/macos-probe-results.json
            build/macos-host-results.json
            build/macos-native-logs/
            build/macos-host-diagnostics/
            build/macos-host-in-place/macos-host-results.json
            build/macos-host-in-place/macos-host-diagnostics/
          if-no-files-found: warn
          retention-days: 7
