lefthook: mise exec -- lefthook

pre-commit:
  parallel: true
  jobs:
    - name: biome
      run: mise run check:staged
    - name: java-format
      glob: "*.java"
      run: mise exec -- google-java-format --aosp --dry-run --set-exit-if-changed {staged_files}
    - name: whitespace
      run: git diff --cached --check
